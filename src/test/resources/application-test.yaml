spring:
  datasource:
    url: jdbc:h2:mem:logitrack;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  cloud:
    config:
      enabled: false

security:
  jwt:
    issuer: logitrack-security
    public-key-location: classpath:keys/jwt-test-public.pem